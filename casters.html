<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Casters Overlay — Valquiria Semanales (1920x1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    font-family: 'Bebas Neue', 'Segoe UI', sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body.preview-mode {
    background-color: #0b0d14;
    background-image:
      linear-gradient(45deg, #121622 25%, transparent 25%),
      linear-gradient(-45deg, #121622 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #121622 75%),
      linear-gradient(-45deg, transparent 75%, #121622 75%);
    background-size: 32px 32px;
    background-position: 0 0, 0 16px, 16px -16px, -16px 0;
  }

  #casters-scaler {
    width: 1920px;
    height: 1080px;
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: top left;
    overflow: hidden;
  }

  #casters-stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.35s ease, transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #casters-stage.is-hidden {
    opacity: 0;
    pointer-events: none;
  }
  #casters-stage.is-entering {
    opacity: 0;
    transform: translateY(-90px);
    transition: none;
  }

  #casters-bg {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    object-fit: cover;
    pointer-events: none;
    z-index: 1;
  }
  #casters-stage[data-bg-mode="transparent"] #casters-bg {
    display: none;
  }

  .dyn-text {
    position: absolute;
    z-index: 2;
    color: #FFFFFF;
    font-family: 'Bebas Neue', Impact, sans-serif;
    line-height: 1;
    white-space: nowrap;
    letter-spacing: 0.02em;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.75);
    transition: opacity 0.28s ease;
  }
  .dyn-text.is-fading {
    opacity: 0;
  }

  /* Exact coordinates from COMENTARISTAS - Semanal valquiria.html */
  #comm1name {
    left: 100px;
    top: 745px;
    font-size: 80px;
    text-align: left;
    transform-origin: left top;
  }
  #comm2name {
    left: 1600px;
    top: 745px;
    font-size: 80px;
    text-align: left;
    transform-origin: left top;
  }
  #comm1twit {
    right: 1660px; /* 1920 - 260 */
    top: 820px;
    font-size: 28px;
    text-align: right;
    transform-origin: right top;
  }
  #comm2twit {
    right: 140px; /* 1920 - 1780 */
    top: 820px;
    font-size: 28px;
    text-align: right;
    transform-origin: right top;
  }
</style>
</head>
<body>
<div id="casters-scaler">
  <div id="casters-stage" data-bg-mode="valquiria">
    <img id="casters-bg" src="assets/valquiria-casters-semanales.png" alt="" />
    <div id="comm1name" class="dyn-text" data-maxw="390"></div>
    <div id="comm2name" class="dyn-text" data-maxw="300"></div>
    <div id="comm1twit" class="dyn-text" data-maxw="338"></div>
    <div id="comm2twit" class="dyn-text" data-maxw="338"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const params = new URLSearchParams(location.search);
  const isPreview = params.get('preview') === '1';
  const isHttp = location.protocol === 'http:' || location.protocol === 'https:';
  if (isPreview) document.body.classList.add('preview-mode');

  const $ = (id) => document.getElementById(id);
  const scaler = $('casters-scaler');
  const stage = $('casters-stage');

  let currentState = null;
  let lastIntroNonce = -1;
  const fieldVals = { comm1name: null, comm2name: null, comm1twit: null, comm2twit: null };

  function rescaleStage() {
    const sx = window.innerWidth / 1920;
    const sy = window.innerHeight / 1080;
    const sc = Math.min(sx, sy);
    const ox = Math.max(0, (window.innerWidth - 1920 * sc) / 2);
    const oy = Math.max(0, (window.innerHeight - 1080 * sc) / 2);
    scaler.style.transform = `translate(${ox}px, ${oy}px) scale(${sc})`;
  }
  window.addEventListener('resize', rescaleStage);
  rescaleStage();

  function fitWidth(el) {
    const maxW = Number(el.dataset.maxw || 0);
    if (!maxW) return;
    el.style.transform = '';
    const w = el.scrollWidth;
    if (w > maxW && w > 0) {
      el.style.transform = `scaleX(${(maxW / w).toFixed(4)})`;
    }
  }

  function setDynText(id, nextText, immediate = false) {
    const val = String(nextText ?? '');
    if (fieldVals[id] === val) return;
    const el = $(id);
    if (!el) return;

    if (immediate || fieldVals[id] === null) {
      fieldVals[id] = val;
      el.textContent = val;
      fitWidth(el);
      return;
    }

    fieldVals[id] = val;
    clearTimeout(el._fadeT);
    el.classList.add('is-fading');
    el._fadeT = setTimeout(() => {
      el.textContent = val;
      fitWidth(el);
      requestAnimationFrame(() => el.classList.remove('is-fading'));
    }, 220);
  }

  function triggerEntryAnim() {
    stage.classList.add('is-entering');
    void stage.offsetWidth;
    requestAnimationFrame(() => stage.classList.remove('is-entering'));
  }

  function render(st) {
    if (!st) return;
    currentState = st;
    const cm = st.commentators || {};
    const isVis = cm.visible !== false;
    stage.classList.toggle('is-hidden', !isVis);
    stage.dataset.bgMode = cm.bgMode === 'transparent' ? 'transparent' : 'valquiria';

    const immediate = isPreview;
    setDynText('comm1name', cm.c1Name || '', immediate);
    setDynText('comm2name', cm.c2Name || '', immediate);
    setDynText('comm1twit', cm.c1Handle || '', immediate);
    setDynText('comm2twit', cm.c2Handle || '', immediate);

    const nonce = Number(cm.introNonce || 0);
    if (lastIntroNonce !== -1 && nonce !== lastIntroNonce && nonce > 0) {
      triggerEntryAnim();
    }
    lastIntroNonce = nonce;
  }

  if (document.fonts?.ready) {
    document.fonts.ready.then(() => {
      ['comm1name', 'comm2name', 'comm1twit', 'comm2twit'].forEach(id => {
        const el = $(id);
        if (el) fitWidth(el);
      });
    }).catch(() => {});
  }

  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d) return;
    if (d.type === 'state-update' && d.state) {
      rescaleStage();
      render(d.state);
    } else if (d.type === 'test-casters-entry') {
      triggerEntryAnim();
    }
  });

  const onSceneShow = () => {
    if (currentState?.commentators?.visible !== false) triggerEntryAnim();
  };
  window.addEventListener('obsSourceActiveChanged', (e) => { if (e?.detail?.active) onSceneShow(); });
  window.addEventListener('obsSourceVisibleChanged', (e) => { if (e?.detail?.visible) onSceneShow(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) onSceneShow(); });

  let bc = null;
  try {
    bc = new BroadcastChannel('fgc_open_scorebar');
    bc.onmessage = (ev) => {
      if (ev.data?.type === 'state' && ev.data.payload) render(ev.data.payload);
    };
  } catch {}

  if (isHttp) {
    fetch('/api/state', { cache: 'no-store' }).then(r => r.json()).then(st => {
      render(st);
      if (!isPreview && st?.commentators?.visible !== false) triggerEntryAnim();
    }).catch(() => {});

    if (!isPreview) {
      let activeEs = null, reconnectTimer = null, pageUnloading = false;
      const closeSSE = () => {
        pageUnloading = true;
        clearTimeout(reconnectTimer);
        if (activeEs) { try { activeEs.close(); } catch {} activeEs = null; }
      };
      window.addEventListener('pagehide', closeSSE);
      window.addEventListener('beforeunload', closeSSE);

      const connectSSE = () => {
        if (pageUnloading) return;
        if (activeEs) { try { activeEs.close(); } catch {} }
        const es = new EventSource('/api/events');
        activeEs = es;
        es.addEventListener('state', (ev) => {
          try {
            const data = JSON.parse(ev.data);
            render(data);
            if (bc) bc.postMessage({ type: 'state', payload: data, fromSse: true });
          } catch {}
        });
        es.onerror = () => {
          if (activeEs === es) activeEs = null;
          try { es.close(); } catch {}
          clearTimeout(reconnectTimer);
          if (!pageUnloading) reconnectTimer = setTimeout(connectSSE, 1500);
        };
      };

      const isObs = Boolean(window.obsstudio);
      if (!isObs && navigator.locks && typeof navigator.locks.request === 'function' && bc) {
        navigator.locks.request('fgc_open_scorebar_sse_leader', () => new Promise((resolve) => {
          if (pageUnloading) return resolve();
          connectSSE();
          window.addEventListener('pagehide', resolve, { once: true });
          window.addEventListener('beforeunload', resolve, { once: true });
        })).catch(() => connectSSE());
      } else {
        connectSSE();
      }
    }
  } else {
    try {
      const cached = localStorage.getItem('fgc_open_scorebar_state_v1');
      if (cached) render(JSON.parse(cached));
    } catch {}
  }
})();
</script>
</body>
</html>
