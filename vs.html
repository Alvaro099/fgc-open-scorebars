      <img id="vs-logo-img" alt="" crossorigin="anonymous" />
    </div>
    <div class="vs-subtitle-slot vs-hit" id="vs-subtitle" data-vs-el="subtitle" data-vs-label="📝 Event Footer Text (Click to Edit)"></div>
  </div>
</div>

<script src="flags.js"></script>
<script src="vs-designs.js"></script>
<script>
(() => {
  const FLAGS_MAP = window.FGC_FLAGS || {};
  const DESIGN_MAP = window.FGC_VS_DESIGN_MAP || {};
  const FALLBACK_DESIGN = (window.FGC_VS_DESIGNS && window.FGC_VS_DESIGNS[0]) || {
    id: 'arcade-pop', split: 'vertical', frame: 'arcade-teeth', divider: 'x-tape', divAnim: 'scroll-down', divW: 28, divTilt: 0,
    emblem: 'winged', embAnim: 'pulse', plate: 'arcade-box', plateBottom: 176, header: 'trapezoid', pat: 'symbols', patOp: 22, wmOp: 0,
    ambient: 'none', font: 'Russo One', lightBg: true, bgLeft: '#f5b800', bgRight: '#f5b800', p1: '#ff3b1f', p2: '#1d4ed8',
    accent: '#ffd400', divColor: '#ffffff', plateBg: 'rgba(10,10,14,0.96)', plateText: '#ffffff',
    headerBg: '#0a0b10', headerText: '#ffffff', frameColor: '#0a0b10', frameAccent: '#ffffff'
  };
  const FONT_STACKS = {
    'Barlow Condensed': `'Barlow Condensed', 'Bahnschrift', sans-serif`,
    'Chakra Petch':     `'Chakra Petch', 'Bahnschrift', sans-serif`,
    'Orbitron':         `'Orbitron', 'Chakra Petch', sans-serif`,
    'Teko':             `'Teko', 'Barlow Condensed', sans-serif`,
    'Russo One':        `'Russo One', 'Impact', sans-serif`,
    'Oswald':           `'Oswald', 'Barlow Condensed', sans-serif`,
    'Bebas Neue':       `'Bebas Neue', 'Impact', sans-serif`,
    'Anton':            `'Anton', 'Impact', sans-serif`,
    'Exo 2':            `'Exo 2', 'Segoe UI', sans-serif`,
    'Black Ops One':    `'Black Ops One', 'Impact', sans-serif`,
    'Montserrat':       `'Montserrat', 'Segoe UI', sans-serif`
  };
  const ENTRY_CLASSES = [
    'anim-slam-split', 'anim-curtain', 'anim-zoom-burst', 'anim-diag-slash',
    'anim-shatter-drop', 'anim-clash-collide', 'anim-cyber-glitch', 'anim-cinema-pan',
    'anim-wipe-iris', 'anim-fade'
  ];

  const qs = new URLSearchParams(location.search);
  const isPreview = qs.has('preview');
  const isHttp = location.protocol === 'http:' || location.protocol === 'https:';
  const $ = (id) => document.getElementById(id);

  let currentScale = 1;
  let interactiveEdit = isPreview;
  let dragEnabled = isPreview;
  let selectedElement = '';

  let rescalePreview = () => {};
  if (isPreview) {
    document.body.classList.add('preview-mode', 'interactive-edit');
    rescalePreview = () => {
      if (!window.innerWidth || !window.innerHeight) return;
      currentScale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      $('vs-scaler').style.transform = `scale(${currentScale})`;
    };
    window.addEventListener('resize', rescalePreview);
    rescalePreview();
  }

  let currentState = null;
  let historyDb = [];
  let lastIntroNonce = 0;
  let lastImgSrc = { p1Char: '', p2Char: '', p1Av: '', p2Av: '' };

  function norm(s) {
    return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }
  function resolveAvatarSrc(raw) {
    const u = String(raw || '').trim();
    if (!u) return '';
    if (u.startsWith('/media/') || u.startsWith('data:')) return u;
    if (/^https?:\/\//i.test(u) && isHttp) return `/api/avatar-proxy?url=${encodeURIComponent(u)}`;
    return u;
  }
  function buildCharRenderUrl(game, pack, charName) {
    if (!charName || !String(charName).trim() || !isHttp) return '';
    return `/api/assets/render?game=${encodeURIComponent(game || 'tekken8')}&pack=${encodeURIComponent(pack || 'full')}&char=${encodeURIComponent(charName.trim())}`;
  }
  function getActiveMatchData(st) {
    const vs = st.vs || {};
    if (vs.source === 'next' && vs.nextMatch?.p1?.name) {
      return { round: vs.nextMatch.roundText || vs.nextMatch.round || st.round || 'UP NEXT', format: st.format || 'FT3', p1: vs.nextMatch.p1, p2: vs.nextMatch.p2 };
    }
    if (vs.source === 'custom' && vs.customMatch) {
      return { round: vs.customMatch.round || 'GRAND FINALS', format: vs.customMatch.format ?? st.format ?? 'FT3', p1: vs.customMatch.p1 || st.p1, p2: vs.customMatch.p2 || st.p2 };
    }
    return { round: st.round || 'ROUND 1', format: st.format || '', p1: st.p1 || {}, p2: st.p2 || {} };
  }
  function computeH2H(nameA, nameB) {
    const a = norm(nameA), b = norm(nameB);
    if (!a || !b || a === b) return { winsA: 0, winsB: 0, total: 0 };
    let winsA = 0, winsB = 0;
    for (const h of historyDb) {
      const p1 = norm(h.p1?.name), p2 = norm(h.p2?.name);
      if (p1 === a && p2 === b) { if (h.winnerSide === 'p1') winsA++; else winsB++; }
      else if (p1 === b && p2 === a) { if (h.winnerSide === 'p1') winsB++; else winsA++; }
    }
    return { winsA, winsB, total: winsA + winsB };
  }

  function resolvePlayerFlags(player, vs) {
    const fMode = vs.flagMode || (vs.showFlags === false ? 'none' : 'both');
    if (fMode === 'none') return [];
    const wantCountry = fMode === 'both' || fMode === 'country';
    const wantRegion = fMode === 'both' || fMode === 'region';
    const cCode = wantCountry ? String(player.flag || '').toUpperCase().trim() : '';
    let rCode = wantRegion ? String(player.region || '').toUpperCase().trim() : '';
    if (cCode && rCode && cCode === rCode) rCode = '';
    const f1 = cCode && FLAGS_MAP[cCode] ? FLAGS_MAP[cCode] : null;
    const f2 = rCode && FLAGS_MAP[rCode] ? FLAGS_MAP[rCode] : null;
    return [f1, f2].filter(Boolean);
  }

  function renderSideFlags(containerId, wmId, player, vs) {
    const cont = $(containerId);
    const wm = $(wmId);
    const list = resolvePlayerFlags(player, vs);
    cont.innerHTML = list.map(f => `<span class="vs-flag-box">${f.svg}</span>`).join('');
    wm.innerHTML = list[0] ? list[0].svg : '';
  }

  function updateSideVisuals(side, player, vs) {
    const charImg = $(`${side}-char-img`);
    const sideEl = $(`${side}-side`);
    const heroAvBox = $(`${side}-hero-avatar`);
    const heroAvImg = $(`${side}-hero-avatar-img`);
    const badgeAvBox = $(`${side}-avatar-badge`);
    const badgeAvImg = $(`${side}-avatar-badge-img`);
    const fallbackEl = $(`${side}-fallback`);

    const charName = String(player.character || '').trim();
    const charUrl = buildCharRenderUrl(vs.game || 'tekken8', vs.pack || 'full', charName);
    const avUrl = resolveAvatarSrc(player.avatar);
    const avMode = vs.design === 'portrait-cards' && vs.avatarMode === 'badge' ? 'portrait-hero' : (vs.avatarMode || 'hero-fallback');

    const applyAvatarVisibility = () => {
      const hasCharLoaded = Boolean(charUrl && charImg.classList.contains('loaded'));
      const hasAv = Boolean(avUrl);
      const showHeroAv = hasAv && (
        avMode === 'portrait-hero' ||
        (avMode === 'hero-fallback' && !hasCharLoaded) ||
        (vs.design === 'portrait-cards' && avMode !== 'off')
      );
      const showBadgeAv = hasAv && !showHeroAv && (avMode === 'badge' || avMode === 'hero-fallback');
      heroAvBox.classList.toggle('active', showHeroAv);
      sideEl.classList.toggle('has-hero-avatar', showHeroAv);
      badgeAvBox.classList.toggle('active', showBadgeAv);
      fallbackEl.classList.toggle('active', !hasCharLoaded && !showHeroAv);
    };

    const avKey = `${side}Av`;
    if (lastImgSrc[avKey] !== avUrl) {
      lastImgSrc[avKey] = avUrl;
      if (avUrl) { heroAvImg.src = avUrl; badgeAvImg.src = avUrl; }
      else { heroAvImg.removeAttribute('src'); badgeAvImg.removeAttribute('src'); }
    }
    const chKey = `${side}Char`;
    if (lastImgSrc[chKey] !== charUrl) {
      lastImgSrc[chKey] = charUrl;
      if (charUrl) {
        charImg.onload = () => { charImg.classList.add('loaded'); applyAvatarVisibility(); };
        charImg.onerror = () => { charImg.classList.remove('loaded'); applyAvatarVisibility(); };
        charImg.src = charUrl;
      } else {
        charImg.classList.remove('loaded');
        charImg.removeAttribute('src');
      }
    }
    fallbackEl.textContent = (String(player.name || side.toUpperCase()).trim().slice(0, 2) || side.toUpperCase()).toUpperCase();
    applyAvatarVisibility();
  }

  function triggerEntryAnim(animName) {
    const stage = $('vs-stage');
    stage.classList.remove(...ENTRY_CLASSES);
    void stage.offsetWidth;
    const cls = `anim-${animName || 'slam-split'}`;
    stage.classList.add(ENTRY_CLASSES.includes(cls) ? cls : 'anim-slam-split');
  }

  function speedToDuration(speed0to100, slowSec, fastSec) {
    const s = Math.max(0, Math.min(100, Number(speed0to100 ?? 45)));
    if (s === 0) return { paused: true, dur: `${slowSec}s` };
    // Exponential curve so both very slow and very fast feel natural
    const t = s / 100;
    const sec = slowSec * Math.pow(fastSec / slowSec, t);
    return { paused: false, dur: `${sec.toFixed(2)}s` };
  }

  function render(st) {
    if (!st) return;
    currentState = st;
    const vs = st.vs || {};
    const stage = $('vs-stage');
    const root = document.documentElement;
    const d = DESIGN_MAP[vs.design] || FALLBACK_DESIGN;

    // Resolve each visual axis (user override > active design default)
    const bgMode = vs.bgMode || 'theme';
    const effPat = (vs.pattern && vs.pattern !== 'theme') ? vs.pattern : (d.pat || 'symbols');
    const effFrame = (vs.frameStyle && vs.frameStyle !== 'theme') ? vs.frameStyle : (d.frame || 'none');
    const effHeader = (vs.headerStyle && vs.headerStyle !== 'theme') ? vs.headerStyle : (d.header || 'trapezoid');
    const effDiv = (vs.dividerStyle && vs.dividerStyle !== 'theme') ? vs.dividerStyle : (d.divider || 'x-tape');
    const effDivAnim = (vs.dividerAnim && vs.dividerAnim !== 'theme') ? vs.dividerAnim : (d.divAnim || 'scroll-down');
    const effEmblem = (vs.emblemStyle && vs.emblemStyle !== 'theme') ? vs.emblemStyle : (d.emblem || 'winged');
    const effEmbAnim = (vs.emblemAnim && vs.emblemAnim !== 'theme') ? vs.emblemAnim : (d.embAnim || 'none');
    const effPlate = (vs.plateStyle && vs.plateStyle !== 'theme') ? vs.plateStyle : (d.plate || 'arcade-box');
    const effAmbient = (vs.ambientAnim && vs.ambientAnim !== 'theme') ? vs.ambientAnim : (d.ambient || 'none');
    const effFont = (vs.fontDisplay && vs.fontDisplay !== 'theme') ? vs.fontDisplay : (d.font || 'Russo One');

    stage.classList.toggle('is-hidden', vs.visible === false);
    stage.dataset.design = d.id;
    stage.dataset.bgMode = bgMode;
    stage.dataset.split = d.split || 'vertical';
    stage.dataset.frame = effFrame;
    stage.dataset.header = effHeader;
    stage.dataset.emblem = effEmblem;
    stage.dataset.embAnim = effEmbAnim;
    stage.dataset.plate = effPlate;
    stage.dataset.ambient = effAmbient;
    stage.dataset.charIdle = vs.charIdleAnim || 'none';

    // Theme Palette + Custom Overrides
    root.style.setProperty('--vs-bg-l', d.bgLeft);
    root.style.setProperty('--vs-bg-r', d.bgRight);
    root.style.setProperty('--vs-bg1', vs.bgColor1 || '#f5b800');
    root.style.setProperty('--vs-bg2', vs.bgColor2 || '#10131e');
    root.style.setProperty('--vs-p1', bgMode === 'custom' ? (vs.p1Color || d.p1) : d.p1);
    root.style.setProperty('--vs-p2', bgMode === 'custom' ? (vs.p2Color || d.p2) : d.p2);
    root.style.setProperty('--vs-accent', (vs.accentColor && vs.accentColor.trim()) ? vs.accentColor : d.accent);
    root.style.setProperty('--vs-div-color', (vs.dividerColor && vs.dividerColor.trim()) ? vs.dividerColor : d.divColor);
    root.style.setProperty('--vs-plate-bg', d.plateBg);
    root.style.setProperty('--vs-plate-text', d.plateText);
    root.style.setProperty('--vs-header-bg', d.headerBg);
    root.style.setProperty('--vs-header-text', d.headerText);
    root.style.setProperty('--vs-frame-color', d.frameColor);
    root.style.setProperty('--vs-frame-accent', d.frameAccent);
    root.style.setProperty('--vs-font-display', FONT_STACKS[effFont] || FONT_STACKS['Russo One']);

    // Pattern Engine (Speed, Direction, Opacity, Scale)
    const patEl = $('vs-pattern');
    patEl.dataset.pat = effPat;
    patEl.dataset.patDir = vs.patternDir || 'diag-dr';
    patEl.dataset.light = d.lightBg ? '1' : '0';
    const patTiming = speedToDuration(vs.patternSpeed ?? 40, 60, 2.2);
    patEl.classList.toggle('paused', patTiming.paused);
    root.style.setProperty('--pat-dur', patTiming.dur);
    const patOpVal = (typeof vs.patternOpacity === 'number' && vs.patternOpacity >= 0) ? vs.patternOpacity : (d.patOp ?? 18);
    root.style.setProperty('--pat-op', (patOpVal / 100).toFixed(2));
    root.style.setProperty('--pat-scale', (Number(vs.patternScale ?? 100) / 100).toFixed(2));

    // Flag Watermark Opacity
    const wmOpVal = (typeof vs.flagWatermarkOpacity === 'number' && vs.flagWatermarkOpacity >= 0) ? vs.flagWatermarkOpacity : (d.wmOp ?? 0);
    root.style.setProperty('--wm-op', (wmOpVal / 100).toFixed(2));

    // Animated Center Divider Engine
    const divEl = $('vs-divider');
    const divTrack = $('vs-divider-track');
    divEl.dataset.divider = effDiv;
    divEl.dataset.divAnim = effDivAnim;
    const divTiming = speedToDuration(vs.dividerSpeed ?? 45, 20, 0.75);
    divEl.classList.toggle('paused', divTiming.paused || effDivAnim === 'static');
    root.style.setProperty('--div-dur', divTiming.dur);
    const divW = Number(vs.dividerWidth) > 0 ? Number(vs.dividerWidth) : (d.divW ?? 24);
    root.style.setProperty('--div-w', `${divW}px`);
    const divTilt = (vs.dividerTilt !== null && vs.dividerTilt !== undefined && vs.dividerTilt !== '') ? Number(vs.dividerTilt) : (d.divTilt ?? 0);
    root.style.setProperty('--div-tilt', `${divTilt}deg`);
    if (effDiv === 'ticker-vs') {
      const txt = `${(vs.emblemText || 'VS').toUpperCase()}  ·  FIGHT  ·  `;
      if (divTrack.dataset.tickerTxt !== txt) {
        divTrack.dataset.tickerTxt = txt;
        divTrack.textContent = txt.repeat(26);
      }
    } else if (divTrack.textContent) {
      divTrack.textContent = '';
      delete divTrack.dataset.tickerTxt;
    }

    // Millimeter Geometry Variables
    root.style.setProperty('--emb-scale', (Number(vs.emblemScale ?? 100) / 100).toFixed(2));
    root.style.setProperty('--emb-y', `${Number(vs.emblemOffsetY ?? 0)}px`);
    $('vs-emblem-text').textContent = (vs.emblemText && String(vs.emblemText).trim()) ? String(vs.emblemText).trim() : 'VS';

    root.style.setProperty('--hdr-scale', (Number(vs.headerScale ?? 100) / 100).toFixed(2));
    root.style.setProperty('--hdr-y', `${Number(vs.headerOffsetY ?? 0)}px`);

    const pBot = (typeof vs.plateBottom === 'number' && vs.plateBottom >= 0) ? vs.plateBottom : (d.plateBottom ?? 168);
    root.style.setProperty('--plate-bottom', `${pBot}px`);
    root.style.setProperty('--plate-w', `${Number(vs.plateWidth ?? 790)}px`);
    root.style.setProperty('--plate-scale', (Number(vs.plateScale ?? 100) / 100).toFixed(2));
    root.style.setProperty('--plate-op', (Number(vs.plateOpacity ?? 96) / 100).toFixed(2));
    root.style.setProperty('--name-scale', (Number(vs.nameScale ?? 100) / 100).toFixed(2));
    root.style.setProperty('--flag-scale', (Number(vs.flagSize ?? 100) / 100).toFixed(2));
    root.style.setProperty('--logo-scale', (Number(vs.logoScale ?? 100) / 100).toFixed(2));
    root.style.setProperty('--h2h-bottom', `${Number(vs.h2hOffsetY ?? 84)}px`);

    root.style.setProperty('--p1-zoom', String((Number(vs.p1Zoom ?? 100)) / 100));
    root.style.setProperty('--p2-zoom', String((Number(vs.p2Zoom ?? 100)) / 100));
    root.style.setProperty('--p1-x', `${Number(vs.p1OffsetX ?? 0)}px`);
    root.style.setProperty('--p2-x', `${Number(vs.p2OffsetX ?? 0)}px`);
    root.style.setProperty('--p1-y', `${Number(vs.p1OffsetY ?? 0)}px`);
    root.style.setProperty('--p2-y', `${Number(vs.p2OffsetY ?? 0)}px`);
    root.style.setProperty('--p1-flip', vs.p1Flip ? '-1' : '1');
    root.style.setProperty('--p2-flip', vs.p2Flip === false ? '1' : '-1');
    root.style.setProperty('--char-shadow-alpha', ((Number(vs.charShadow ?? 60) / 100) * 0.9).toFixed(2));

    const spd = Math.max(40, Math.min(200, Number(vs.entrySpeed ?? 100)));
    root.style.setProperty('--entry-mult', (100 / spd).toFixed(2));

    // Match Content
    const match = getActiveMatchData(st);
    const p1 = match.p1 || {};
    const p2 = match.p2 || {};

    $('vs-eyebrow').textContent = vs.eyebrow ?? 'UP NEXT';
    $('vs-round').textContent = match.round || 'ROUND 1';
    $('vs-format').textContent = (st.showFormat !== false && match.format) ? match.format : '';

    $('p1-name').textContent = p1.name || 'PLAYER 1';
    $('p2-name').textContent = p2.name || 'PLAYER 2';
    $('p1-sponsor').textContent = vs.showSponsor !== false ? (p1.sponsor || '') : '';
    $('p2-sponsor').textContent = vs.showSponsor !== false ? (p2.sponsor || '') : '';

    const b1 = $('p1-bracket');
    b1.textContent = p1.bracket ? `[${p1.bracket}]` : '';
    b1.className = `vs-bracket ${p1.bracket || ''}`;
    const b2 = $('p2-bracket');
    b2.textContent = p2.bracket ? `[${p2.bracket}]` : '';
    b2.className = `vs-bracket ${p2.bracket || ''}`;

    $('p1-char-sub').textContent = vs.showCharName !== false ? (p1.character || '') : '';
    $('p2-char-sub').textContent = vs.showCharName !== false ? (p2.character || '') : '';

    const sc1 = $('p1-score'), sc2 = $('p2-score');
    sc1.textContent = p1.score ?? 0;
    sc2.textContent = p2.score ?? 0;
    sc1.classList.toggle('active', Boolean(vs.showScore));
    sc2.classList.toggle('active', Boolean(vs.showScore));

    renderSideFlags('p1-flags', 'p1-flag-wm', p1, vs);
    renderSideFlags('p2-flags', 'p2-flag-wm', p2, vs);
    updateSideVisuals('p1', p1, vs);
    updateSideVisuals('p2', p2, vs);

    const h2h = computeH2H(p1.name, p2.name);
    const h2hPill = $('vs-h2h-pill');
    if (vs.showH2H !== false && h2h.total > 0) {
      $('vs-h2h-score').textContent = `${h2h.winsA} - ${h2h.winsB}`;
      h2hPill.classList.add('active');
    } else {
      h2hPill.classList.remove('active');
    }

    const logoSlot = $('vs-logo-slot');
    const logoImg = $('vs-logo-img');
    logoSlot.dataset.pos = vs.logoPos || 'bottom-left';
    if (vs.showLogo !== false && vs.logoUrl) {
      if (logoImg.getAttribute('src') !== vs.logoUrl) logoImg.src = vs.logoUrl;
      logoSlot.classList.add('active');
    } else {
      logoSlot.classList.remove('active');
    }
    $('vs-subtitle').textContent = vs.subtitle || st.tournament || '';

    if (vs.introNonce && vs.introNonce !== lastIntroNonce) {
      lastIntroNonce = vs.introNonce;
      triggerEntryAnim(vs.entryAnim);
    }
  }

  /* =========================================================================
     INTERACTIVE CLICK-TO-SELECT & DIRECT DRAG STUDIO (PREVIEW MODE ONLY!)
     ========================================================================= */
  function highlightSelectedEl(elKey) {
    selectedElement = elKey || '';
    document.querySelectorAll('.vs-hit.vs-selected').forEach(n => n.classList.remove('vs-selected'));
    if (!selectedElement) return;
    document.querySelectorAll(`.vs-hit[data-vs-el="${selectedElement}"]`).forEach(n => n.classList.add('vs-selected'));
  }

  if (isPreview) {
    const hoverPill = $('vs-hover-pill');
    let dragState = null;

    document.addEventListener('mousemove', (e) => {
      if (dragState && dragEnabled) {
        const dx = Math.round((e.clientX - dragState.startX) / (currentScale || 1));
        const dy = Math.round((e.clientY - dragState.startY) / (currentScale || 1));
        if (!dragState.moved && Math.hypot(dx, dy) > 5) dragState.moved = true;
        if (dragState.moved) {
          const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(v)));
          const patch = {};
          if (dragState.el === 'p1-char') {
            patch.p1OffsetX = clamp(dragState.base.p1X + dx, -300, 300);
            patch.p1OffsetY = clamp(dragState.base.p1Y + dy, -260, 260);
          } else if (dragState.el === 'p2-char') {
            patch.p2OffsetX = clamp(dragState.base.p2X + dx, -300, 300);
            patch.p2OffsetY = clamp(dragState.base.p2Y + dy, -260, 260);
          } else if (dragState.el === 'emblem') {
            patch.emblemOffsetY = clamp(dragState.base.embY + dy, -300, 300);
          } else if (dragState.el === 'header') {
            patch.headerOffsetY = clamp(dragState.base.hdrY + dy, 0, 180);
          } else if (dragState.el === 'p1-plate' || dragState.el === 'p2-plate') {
            patch.plateBottom = clamp(dragState.base.plateB - dy, 30, 420);
          } else if (dragState.el === 'h2h') {
            patch.h2hOffsetY = clamp(dragState.base.h2hB - dy, 20, 240);
          }
          if (Object.keys(patch).length) {
            dragState.lastPatch = patch;
            window.parent?.postMessage({ type: 'vs-drag-patch', patch, commit: false }, '*');
          }
        }
        return;
      }

      if (!interactiveEdit) { hoverPill.style.display = 'none'; return; }
      const hit = e.target.closest('.vs-hit');
      if (hit && hit.dataset.vsLabel) {
        hoverPill.textContent = hit.dataset.vsLabel;
        hoverPill.style.display = 'block';
        hoverPill.style.left = `${Math.min(window.innerWidth - 220, e.clientX + 12)}px`;
        hoverPill.style.top = `${Math.max(8, e.clientY - 30)}px`;
      } else {
        hoverPill.style.display = 'none';
      }
    });

    document.addEventListener('mouseleave', () => { hoverPill.style.display = 'none'; });

    document.addEventListener('mousedown', (e) => {
      if (!interactiveEdit) return;
      const hit = e.target.closest('.vs-hit');
      if (!hit) return;
      const elKey = hit.dataset.vsEl;
      const vs = currentState?.vs || {};
      const d = DESIGN_MAP[vs.design] || FALLBACK_DESIGN;
      dragState = {
        el: elKey,
        label: hit.dataset.vsLabel || elKey,
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
        lastPatch: null,
        base: {
          p1X: Number(vs.p1OffsetX ?? 0), p1Y: Number(vs.p1OffsetY ?? 0),
          p2X: Number(vs.p2OffsetX ?? 0), p2Y: Number(vs.p2OffsetY ?? 0),
          embY: Number(vs.emblemOffsetY ?? 0),
          hdrY: Number(vs.headerOffsetY ?? 0),
          plateB: (typeof vs.plateBottom === 'number' && vs.plateBottom >= 0) ? vs.plateBottom : (d.plateBottom ?? 168),
          h2hB: Number(vs.h2hOffsetY ?? 84)
        }
      };
      e.preventDefault();
    });

    window.addEventListener('mouseup', () => {
      if (!dragState) return;
      const ds = dragState;
      dragState = null;
      highlightSelectedEl(ds.el);
      if (ds.moved && ds.lastPatch) {
        window.parent?.postMessage({ type: 'vs-drag-patch', patch: ds.lastPatch, commit: true }, '*');
      }
      window.parent?.postMessage({ type: 'vs-select-element', element: ds.el, label: ds.label }, '*');
    });
  }

  /* =========================================================================
     PURE HTML5 CANVAS 1920x1080 PNG GRAPHIC EXPORTER
     ========================================================================= */
  async function loadImg(src) {
    if (!src) return null;
    return new Promise((resolve) => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = src;
    });
  }
  async function loadSvgAsImg(svgText) {
    if (!svgText) return null;
    const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const im = await loadImg(url);
    URL.revokeObjectURL(url);
    return im;
  }

  async function exportPngGraphic() {
    if (!currentState) return;
    const st = currentState;
    const vs = st.vs || {};
    const d = DESIGN_MAP[vs.design] || FALLBACK_DESIGN;
    const match = getActiveMatchData(st);
    const p1 = match.p1 || {}, p2 = match.p2 || {};
    const pickHex = (str, fb) => (String(str || '').match(/#[0-9a-fA-F]{6}/) || [fb])[0];

    const canvas = document.createElement('canvas');
    canvas.width = 1920; canvas.height = 1080;
    const ctx = canvas.getContext('2d');

    if (vs.bgMode !== 'transparent') {
      const c1 = vs.bgMode === 'custom' ? (vs.p1Color || d.p1) : pickHex(d.bgLeft, d.p1);
      const c2 = vs.bgMode === 'custom' ? (vs.p2Color || d.p2) : pickHex(d.bgRight, d.p2);
      const dark = vs.bgMode === 'custom' ? (vs.bgColor2 || '#0b0e16') : (d.lightBg ? '#e2e8f0' : '#080a12');
      const g1 = ctx.createRadialGradient(480, 460, 80, 480, 540, 980);
      g1.addColorStop(0, c1); g1.addColorStop(1, dark);
      ctx.fillStyle = g1; ctx.fillRect(0, 0, 960, 1080);
      const g2 = ctx.createRadialGradient(1440, 460, 80, 1440, 540, 980);
      g2.addColorStop(0, c2); g2.addColorStop(1, dark);
      ctx.fillStyle = g2; ctx.fillRect(960, 0, 960, 1080);

      const effDiv = (vs.dividerStyle && vs.dividerStyle !== 'theme') ? vs.dividerStyle : d.divider;
      if (effDiv !== 'none') {
        const w = Number(vs.dividerWidth) > 0 ? Number(vs.dividerWidth) : (d.divW || 8);
        ctx.fillStyle = vs.dividerColor || d.divColor || '#ffffff';
        ctx.fillRect(960 - w / 2, 0, w, 1080);
      }
    }

    const [p1CharIm, p2CharIm, p1AvIm, p2AvIm, logoIm] = await Promise.all([
      loadImg(buildCharRenderUrl(vs.game, vs.pack, p1.character)),
      loadImg(buildCharRenderUrl(vs.game, vs.pack, p2.character)),
      loadImg(resolveAvatarSrc(p1.avatar)),
      loadImg(resolveAvatarSrc(p2.avatar)),
      vs.showLogo !== false && vs.logoUrl ? loadImg(vs.logoUrl) : Promise.resolve(null)
    ]);

    const drawChar = (im, cx, zoom, offX, offY, flip, dim) => {
      if (!im) return;
      const targetH = 900 * (zoom / 100);
      const scale = targetH / im.naturalHeight;
      const w = im.naturalWidth * scale, h = im.naturalHeight * scale;
      ctx.save();
      ctx.globalAlpha = dim ? 0.25 : 1;
      ctx.translate(cx + offX, 540 + offY);
      ctx.scale(flip ? -1 : 1, 1);
      ctx.shadowColor = `rgba(0,0,0,${((Number(vs.charShadow ?? 60) / 100) * 0.9).toFixed(2)})`;
      ctx.shadowBlur = 28; ctx.shadowOffsetY = 16;
      ctx.drawImage(im, -w / 2, -h / 2, w, h);
      ctx.restore();
    };
    const drawHeroAv = (im, cx, borderColor) => {
      if (!im) return;
      const sz = 440, x = cx - sz / 2, y = 210;
      ctx.save();
      ctx.beginPath(); ctx.roundRect(x, y, sz, sz, 26); ctx.clip();
      const s = Math.max(sz / im.naturalWidth, sz / im.naturalHeight);
      ctx.drawImage(im, cx - (im.naturalWidth * s) / 2, y + sz / 2 - (im.naturalHeight * s) / 2, im.naturalWidth * s, im.naturalHeight * s);
      ctx.restore();
      ctx.lineWidth = 8; ctx.strokeStyle = borderColor;
      ctx.beginPath(); ctx.roundRect(x, y, sz, sz, 26); ctx.stroke();
    };

    const avMode = vs.design === 'portrait-cards' && vs.avatarMode === 'badge' ? 'portrait-hero' : (vs.avatarMode || 'hero-fallback');
    const p1Hero = Boolean(p1AvIm && (avMode === 'portrait-hero' || (avMode === 'hero-fallback' && !p1CharIm)));
    const p2Hero = Boolean(p2AvIm && (avMode === 'portrait-hero' || (avMode === 'hero-fallback' && !p2CharIm)));
    drawChar(p1CharIm, 480, Number(vs.p1Zoom ?? 100), Number(vs.p1OffsetX ?? 0), Number(vs.p1OffsetY ?? 0), Boolean(vs.p1Flip), p1Hero);
    drawChar(p2CharIm, 1440, Number(vs.p2Zoom ?? 100), Number(vs.p2OffsetX ?? 0), Number(vs.p2OffsetY ?? 0), vs.p2Flip !== false, p2Hero);
    if (p1Hero) drawHeroAv(p1AvIm, 480, vs.p1Color || d.p1);
    if (p2Hero) drawHeroAv(p2AvIm, 1440, vs.p2Color || d.p2);

    // Header
    const hdrY = Number(vs.headerOffsetY ?? 0);
    if ((vs.headerStyle || d.header) !== 'none') {
      ctx.save();
      ctx.fillStyle = pickHex(d.headerBg, '#0a0c13');
      ctx.beginPath();
      ctx.moveTo(640, hdrY); ctx.lineTo(1280, hdrY); ctx.lineTo(1240, hdrY + 108); ctx.lineTo(680, hdrY + 108); ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = vs.accentColor || d.accent || '#fff'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(680, hdrY + 108); ctx.lineTo(1240, hdrY + 108); ctx.stroke();
      ctx.textAlign = 'center';
      if (vs.eyebrow) {
        ctx.fillStyle = vs.accentColor || d.accent || '#facc15';
        ctx.font = '800 22px "Barlow Condensed", sans-serif';
        ctx.fillText(String(vs.eyebrow).toUpperCase(), 960, hdrY + 34);
      }
      ctx.fillStyle = d.headerText || '#ffffff';
      ctx.font = '900 42px "Russo One", "Barlow Condensed", sans-serif';
      const roundTitle = `${(match.round || 'ROUND 1').toUpperCase()}${(st.showFormat !== false && match.format) ? `  ·  ${match.format}` : ''}`;
      ctx.fillText(roundTitle, 960, hdrY + 84);
      ctx.restore();
    }

    // Center VS Emblem
    if ((vs.emblemStyle || d.emblem) !== 'none') {
      ctx.save();
      const ey = 508 + Number(vs.emblemOffsetY ?? 0);
      const sz = Math.round(112 * (Number(vs.emblemScale ?? 100) / 100));
      ctx.font = `italic 900 ${sz}px "Russo One", "Barlow Condensed", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 14; ctx.strokeStyle = '#090b10';
      const txt = (vs.emblemText && vs.emblemText.trim()) ? vs.emblemText.trim() : 'VS';
      ctx.strokeText(txt, 960, ey);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(txt, 960, ey);
      ctx.restore();
    }

    // Plates with Region-Only / Country / Both flag support!
    const pBot = (typeof vs.plateBottom === 'number' && vs.plateBottom >= 0) ? vs.plateBottom : (d.plateBottom ?? 168);
    const pW = Number(vs.plateWidth ?? 790);
    const drawPlate = async (side, player, avIm, isHero) => {
      const isLeft = side === 'p1';
      const h = 142;
      const x = isLeft ? 62 : (1920 - 62 - pW);
      const y = 1080 - pBot - h;
      ctx.save();
      ctx.fillStyle = d.lightBg && d.plateText === '#0f172a' ? 'rgba(255,255,255,0.95)' : 'rgba(8, 10, 16, 0.95)';
      ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.roundRect(x, y, pW, h, 8); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = isLeft ? (vs.bgMode === 'custom' ? (vs.p1Color || d.p1) : d.p1) : (vs.bgMode === 'custom' ? (vs.p2Color || d.p2) : d.p2);
      ctx.fillRect(isLeft ? x : x + pW - 10, y, 10, h);

      const showBadge = Boolean(avIm && !isHero && avMode !== 'off');
      let textX = isLeft ? x + 32 : x + pW - 32;
      if (showBadge) {
        const bx = isLeft ? x + 28 : x + pW - 126, by = y + 22;
        ctx.save(); ctx.beginPath(); ctx.roundRect(bx, by, 98, 98, 12); ctx.clip();
        const s = Math.max(98 / avIm.naturalWidth, 98 / avIm.naturalHeight);
        ctx.drawImage(avIm, bx + 49 - (avIm.naturalWidth * s) / 2, by + 49 - (avIm.naturalHeight * s) / 2, avIm.naturalWidth * s, avIm.naturalHeight * s);
        ctx.restore();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(bx, by, 98, 98, 12); ctx.stroke();
        textX = isLeft ? x + 146 : x + pW - 146;
      }

      const flagItems = resolvePlayerFlags(player, vs);
      let metaOffset = 0;
      for (const fi of flagItems) {
        const flagIm = await loadSvgAsImg(fi.svg);
        if (flagIm) {
          const fx = isLeft ? textX + metaOffset : textX - metaOffset - 44;
          ctx.drawImage(flagIm, fx, y + 18, 44, 29);
          metaOffset += 52;
        }
      }

      ctx.textAlign = isLeft ? 'left' : 'right';
      const metaLabel = [vs.showSponsor !== false ? player.sponsor : '', player.bracket ? `[${player.bracket}]` : ''].filter(Boolean).join('  ');
      if (metaLabel) {
        ctx.fillStyle = vs.accentColor || d.accent || '#facc15';
        ctx.font = '800 26px "Barlow Condensed", sans-serif';
        ctx.fillText(metaLabel.toUpperCase(), isLeft ? textX + metaOffset : textX - metaOffset, y + 41);
      }
      ctx.fillStyle = d.plateText || '#ffffff';
      ctx.font = `900 ${Math.round(58 * (Number(vs.nameScale ?? 100) / 100))}px "Russo One", "Barlow Condensed", sans-serif`;
      ctx.fillText((player.name || (isLeft ? 'PLAYER 1' : 'PLAYER 2')).slice(0, 22), textX, y + 98);
      if (vs.showCharName !== false && player.character) {
        ctx.fillStyle = d.plateText === '#0f172a' ? 'rgba(15,23,42,0.72)' : 'rgba(255,255,255,0.75)';
        ctx.font = '800 23px "Barlow Condensed", sans-serif';
        ctx.fillText(String(player.character).toUpperCase(), textX, y + 128);
      }
      ctx.restore();
    };
    await drawPlate('p1', p1, p1AvIm, p1Hero);
    await drawPlate('p2', p2, p2AvIm, p2Hero);

    if (logoIm) {
      const scale = Math.min(220 / logoIm.naturalWidth, 96 / logoIm.naturalHeight, 1) * (Number(vs.logoScale ?? 100) / 100);
      const lw = logoIm.naturalWidth * scale, lh = logoIm.naturalHeight * scale;
      const pos = vs.logoPos || 'bottom-left';
      const lx = pos.endsWith('right') ? (1920 - 44 - lw) : 44;
      const ly = pos.startsWith('top') ? 24 : (1054 - lh);
      ctx.drawImage(logoIm, lx, ly, lw, lh);
    }

    const a = document.createElement('a');
    const safeName = `${(p1.name || 'p1')}-vs-${(p2.name || 'p2')}`.toLowerCase().replace(/[^a-z0-9-]+/g, '-');
    a.download = `vs-splash-${safeName}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  /* =========================================================================
     SYNC ENGINE: SSE + BroadcastChannel + Panel postMessage + OBS Scene Hooks
     ========================================================================= */
  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d) return;
    if (d.type === 'state-update' && d.state) { rescalePreview(); render(d.state); }
    else if (d.type === 'history-update' && Array.isArray(d.history)) { historyDb = d.history; if (currentState) render(currentState); }
    else if (d.type === 'test-vs-entry') triggerEntryAnim(currentState?.vs?.entryAnim || 'slam-split');
    else if (d.type === 'export-vs-png') exportPngGraphic();
    else if (d.type === 'vs-interactive-config' && isPreview) {
      interactiveEdit = Boolean(d.interactive);
      dragEnabled = Boolean(d.drag);
      document.body.classList.toggle('interactive-edit', interactiveEdit);
      if (!interactiveEdit) highlightSelectedEl('');
    } else if (d.type === 'vs-highlight-element' && isPreview) {
      highlightSelectedEl(d.element || '');
    }
  });

  const onSceneShow = () => {
    if (currentState?.vs?.visible !== false) triggerEntryAnim(currentState?.vs?.entryAnim || 'slam-split');
  };
  window.addEventListener('obsSourceActiveChanged', (e) => { if (e?.detail?.active) onSceneShow(); });
  window.addEventListener('obsSourceVisibleChanged', (e) => { if (e?.detail?.visible) onSceneShow(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) onSceneShow(); });

  try {
    const bc = new BroadcastChannel('fgc_open_scorebar');
    bc.onmessage = (ev) => { if (ev.data?.type === 'state' && ev.data.payload) render(ev.data.payload); };
  } catch {}

  if (isHttp) {
    fetch('/api/history').then(r => r.json()).then(list => { historyDb = list; if (currentState) render(currentState); }).catch(() => {});
    fetch('/api/state').then(r => r.json()).then(st => {
      render(st);
      if (!isPreview && st?.vs?.visible !== false) triggerEntryAnim(st?.vs?.entryAnim || 'slam-split');
    }).catch(() => {});
    const es = new EventSource('/api/events');
    es.addEventListener('state', (ev) => { try { render(JSON.parse(ev.data)); } catch {} });
  }
})();
</script>
</body>
</html>
